# Construction du bridge StageKontrol pour Windows et macOS, et publication dans une release GitHub.
# Ce fichier est prévu pour le dépôt public du bridge (github.com/Peype/midi-bridge), où le contenu
# du dossier bridge/ est à la racine. Dans le dépôt de l'app, il est inactif (GitHub ne lit que
# le .github de la racine).
#
# Déclenchement :
#   - en poussant un tag « v* » (ex. git tag v1.0.0 && git push origin v1.0.0) ;
#   - ou à la main (onglet Actions → « Bridge » → Run workflow) : construction seule, sans release.
#
# Fichiers publiés (liens stables, utilisés par l'app : …/releases/latest/download/<fichier>) :
#   StageKontrol-Bridge-Windows.zip, StageKontrol-Bridge-macOS-AppleSilicon.zip,
#   StageKontrol-Bridge-macOS-Intel.zip
#
# Les releases sont publiées dans ce même dépôt (public) : aucun jeton à créer.

name: Bridge

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: StageKontrol-Bridge-Windows.zip
            readme: LISEZMOI-Windows.txt
          - os: macos-latest # Apple Silicon (arm64)
            asset: StageKontrol-Bridge-macOS-AppleSilicon.zip
            readme: LISEZMOI-macOS.txt
          - os: macos-15-intel # Mac Intel (x86_64)
            asset: StageKontrol-Bridge-macOS-Intel.zip
            readme: LISEZMOI-macOS.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Tests
        run: python -m pytest -q

      - name: Construction (PyInstaller)
        run: pyinstaller --noconfirm stagekontrol-bridge.spec

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/${{ matrix.readme }} dist/StageKontrol-Bridge/
          Compress-Archive -Path dist/StageKontrol-Bridge -DestinationPath ${{ matrix.asset }}

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cp packaging/${{ matrix.readme }} dist/StageKontrol-Bridge/
          # ditto garde les droits d'exécution et les liens symboliques des bibliothèques.
          ditto -c -k --keepParent dist/StageKontrol-Bridge ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: StageKontrol Bridge ${{ github.ref_name }}
          make_latest: true
          body: |
            Programme à installer sur l'ordinateur (Windows ou Mac) pour relier l'app StageKontrol à
            votre logiciel musical. Téléchargez le fichier de votre système, décompressez-le et lisez
            le fichier LISEZMOI qu'il contient.
          files: assets/*.zip
